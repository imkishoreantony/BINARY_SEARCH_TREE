<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BST Visualizer - Nature Theme</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500;700&display=swap');

body {
    font-family: 'Comfortaa', sans-serif;
    text-align: center;
    background:
    linear-gradient(120deg, rgba(34,197,94,0.3), transparent 70%),
    linear-gradient(160deg, rgba(132,204,22,0.25), transparent 70%),
    linear-gradient(135deg, #14532d, #052e16);
}

/* Title */
h1 {
    margin-top: 20px;
    font-size: 2.8rem;
    font-weight: 700;

    background: linear-gradient(
        135deg,
        #4282ad,
        #6aaed6,
        #9fd3f2
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 6px rgba(66,130,173,0.4),
        0 0 12px rgba(159,211,242,0.3);
}

/* Container */
.container {
    margin: 20px auto;
    padding: 20px;
    width: 80%;
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

/* Input */
input {
    padding: 10px;
    width: 300px;
    border-radius: 8px;
    border: none;
    margin: 10px;
}

/* Buttons */
button {
    padding: 10px 15px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #16a34a, #4ade80);
}

button:hover {
    transform: scale(1.05);
}

/* Output */
#output {
    margin-top: 15px;
    font-size: 20px;
    color: #bbf7d0;
}

/* Tree */
#tree {
    position: relative;
    height: 500px;
}

/* Node (Leaf style) */
.node {
    position: absolute;
    width: 45px;
    height: 45px;
    background: #22c55e;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.5s;
    box-shadow: 0 0 10px rgba(34,197,94,0.6);
}

/* Highlight */
.highlight {
    background: #facc15 !important;
    transform: scale(1.2);
}

/* Branch Lines */
.line {
    position: absolute;
    height: 2px;
    background: #8b5a2b; /* Brown */
    transform-origin: left;
}

/* Leaves Animation */
.leaf {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    font-size: 29px;
    animation: fall 2.5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>BST Visualizer 🌳</h1>

<div class="container">
    <input id="inputValues" placeholder="Enter numbers (e.g. 50,30,70)">
    <br>

    <button onclick="buildTree()">Build BST</button><br>

    <button onclick="startTraversal('inorder')">Inorder</button>
    <button onclick="startTraversal('preorder')">Preorder</button>
    <button onclick="startTraversal('postorder')">Postorder</button>

    <div id="output"></div>
</div>

<div id="tree"></div>

<script>
class Node {
    constructor(value) {
        this.value = value;
        this.left = null;
        this.right = null;
        this.x = 0;
        this.y = 0;
    }
}

let root = null;
let nodeMap = {};

// Insert
function insert(root, value) {
    if (!root) return new Node(value);

    if (value < root.value)
        root.left = insert(root.left, value);
    else
        root.right = insert(root.right, value);

    return root;
}

// Build Tree
function buildTree() {
    document.getElementById("tree").innerHTML = "";
    document.getElementById("output").innerText = "";
    root = null;
    nodeMap = {};

    let values = document.getElementById("inputValues").value
        .split(',')
        .map(v => parseInt(v.trim()))
        .filter(v => !isNaN(v));

    let delay = 0;

    values.forEach(val => {
        setTimeout(() => {
            root = insert(root, val);
            drawTree();
        }, delay);
        delay += 700;
    });
}

// Draw Tree
function drawTree() {
    const container = document.getElementById("tree");
    container.innerHTML = "";
    nodeMap = {};

    let width = container.clientWidth;

    function setPos(node, x, y, gap) {
        if (!node) return;
        node.x = x;
        node.y = y;

        setPos(node.left, x - gap, y + 80, gap / 2);
        setPos(node.right, x + gap, y + 80, gap / 2);
    }

    setPos(root, width / 2, 20, width / 4);

    function draw(node) {
        if (!node) return;

        let div = document.createElement("div");
        div.className = "node";
        div.innerText = node.value;
        div.style.left = node.x + "px";
        div.style.top = node.y + "px";

        nodeMap[node.value] = div;

        container.appendChild(div);

        if (node.left) drawLine(node, node.left);
        if (node.right) drawLine(node, node.right);

        draw(node.left);
        draw(node.right);
    }

    function drawLine(p, c) {
        let line = document.createElement("div");
        line.className = "line";

        let dx = c.x - p.x;
        let dy = c.y - p.y;

        let length = Math.sqrt(dx*dx + dy*dy);
        let angle = Math.atan2(dy, dx) * 180 / Math.PI;

        line.style.width = length + "px";
        line.style.left = p.x + 20 + "px";
        line.style.top = p.y + 20 + "px";
        line.style.transform = `rotate(${angle}deg)`;

        document.getElementById("tree").appendChild(line);
    }

    draw(root);
}

// Traversals
function inorder(node, res=[]) {
    if (!node) return res;
    inorder(node.left, res);
    res.push(node.value);
    inorder(node.right, res);
    return res;
}

function preorder(node, res=[]) {
    if (!node) return res;
    res.push(node.value);
    preorder(node.left, res);
    preorder(node.right, res);
    return res;
}

function postorder(node, res=[]) {
    if (!node) return res;
    postorder(node.left, res);
    postorder(node.right, res);
    res.push(node.value);
    return res;
}

function startTraversal(type) {
    let result = [];

    if (type === 'inorder') result = inorder(root);
    if (type === 'preorder') result = preorder(root);
    if (type === 'postorder') result = postorder(root);

    animateTraversal(result);
}

// Leaves instead of confetti
function celebrate() {
    const leaves = ["🍂","🍁","🍃","🌿"];

    for (let i = 0; i < 50; i++) {
        let leaf = document.createElement("div");
        leaf.className = "leaf";
        leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
        leaf.style.left = Math.random() * 100 + "vw";

        document.body.appendChild(leaf);
        setTimeout(() => leaf.remove(), 2500);
    }
}

// Animation
function animateTraversal(order) {
    let i = 0;
    document.getElementById("output").innerText = "";

    function step() {
        if (i > 0) nodeMap[order[i-1]].classList.remove("highlight");

        if (i < order.length) {
            nodeMap[order[i]].classList.add("highlight");
            i++;
            setTimeout(step, 600);
        } else {
            celebrate();
            setTimeout(() => {
                document.getElementById("output").innerText =
                    "Traversal Result: " + order.join(" ");
            }, 800);
        }
    }

    step();
}
</script>

</body>
</html>
